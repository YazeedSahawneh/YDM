<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0F141B; --surface:#161D27; --border:#2A3442; --text:#E6EAF0; --muted:#8A96A8; --accent:#3B82F6; }
  * { box-sizing: border-box; }
  body { margin:0; width:290px; background:var(--bg); color:var(--text);
         font: 13px "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); }
  header img { width:28px; height:28px; }
  header b { font-size:15px; }
  #status { margin-left:auto; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  #dot { width:8px; height:8px; border-radius:50%; background:#6b7280; }
  main { padding:12px 16px 16px; display:grid; gap:12px; }
  button { width:100%; padding:10px; border-radius:8px; border:1px solid var(--accent);
           background:var(--accent); color:white; font-weight:600; cursor:pointer; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  label.row { display:flex; justify-content:space-between; align-items:center; }
  .muted { color:var(--muted); font-size:12px; }
  details summary { cursor:pointer; color:var(--muted); }
  details .grid { display:grid; gap:8px; margin-top:8px; }
  input[type=number], input[type=text] { width:100%; background:var(--surface); color:var(--text);
         border:1px solid var(--border); border-radius:6px; padding:6px 8px; }
  .switch { position:relative; width:36px; height:20px; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:var(--border); border-radius:20px; transition:.2s; cursor:pointer; }
  .slider:before { content:""; position:absolute; width:14px; height:14px; left:3px; top:3px;
                   background:white; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider { background:var(--accent); }
  .switch input:checked + .slider:before { transform:translateX(16px); }
</style>
</head>
<body>
<header>
  <img src="icons/icon48.png" alt="">
  <b>YDM</b>
  <span id="status"><span id="dot"></span><span id="statusText">Checking…</span></span>
</header>
<main>
  <button id="grab">🎬 Grab video from this tab</button>
  <label class="row">Catch browser downloads
    <span class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></span>
  </label>
  <details>
    <summary>Options</summary>
    <div class="grid">
      <label>App port <input type="number" id="port" min="1024" max="65535"></label>
      <label>Ignore files smaller than (KB) <input type="number" id="minSizeKB" min="0"></label>
      <label>Never catch these extensions <input type="text" id="skipExt" placeholder="e.g. pdf, jpg"></label>
    </div>
  </details>
  <div class="muted" id="hint"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
