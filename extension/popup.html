<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#121417; --panel:#191C20; --raised:#22262B; --line:#2C3137; --text:#ECE8E1;
          --muted:#969BA2; --faint:#5E646C; --accent:#FFB547; --on-accent:#1A1408; --signal:#3DDBC0;
          --error:#FF6B5E; --done:#A6E35A; }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent); color: var(--on-accent); }
  body { margin:0; width:340px; background:var(--bg); color:var(--text);
         font: 13px "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--panel);
           border-bottom:1px solid var(--line); }
  header img { width:24px; height:24px; }
  header b { font-size:14px; letter-spacing:.2px; }
  #status { margin-left:auto; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px; }
  #led { width:8px; height:8px; border-radius:50%; background:var(--faint); }
  #led.on { background:var(--signal); box-shadow:0 0 0 3px rgba(61,219,192,.18); }
  #led.off { background:var(--error); box-shadow:0 0 0 3px rgba(255,107,94,.16); }
  main { padding:14px; display:grid; gap:14px; }
  .primary { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:10px;
             border-radius:7px; border:1px solid var(--accent); background:var(--accent); color:var(--on-accent);
             font:600 13px "Segoe UI", system-ui, sans-serif; cursor:pointer; }
  .primary:hover { background:#FFC266; }
  .primary:disabled { opacity:.45; cursor:default; }
  .legend { font-size:11px; font-weight:600; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); }
  #media { display:grid; gap:6px; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line);
         border-radius:7px; background:var(--panel); }
  .row .name { flex:1; min-width:0; }
  .row .name div:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .meta { font-size:11.5px; color:var(--muted); font-variant-numeric: tabular-nums; }
  .row button { border:1px solid var(--line); background:var(--raised); color:var(--text); border-radius:6px;
                padding:5px 10px; cursor:pointer; font:600 12px "Segoe UI", system-ui, sans-serif; }
  .row button:hover { border-color:var(--accent); color:var(--accent); }
  .row button.sent { color:var(--done); border-color:var(--line); }
  .empty { color:var(--muted); font-size:12px; }
  label.switch-row { display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:pointer; }
  .switch { position:relative; width:34px; height:20px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:var(--raised); border:1px solid var(--line); border-radius:20px; transition:.15s; }
  .slider:before { content:""; position:absolute; width:14px; height:14px; left:2px; top:2px;
                   background:var(--muted); border-radius:50%; transition:.15s; }
  .switch input:checked + .slider { background:var(--accent); border-color:var(--accent); }
  .switch input:checked + .slider:before { transform:translateX(14px); background:var(--on-accent); }
  .switch input:focus-visible + .slider { outline:2px solid var(--accent); outline-offset:2px; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  details .grid { display:grid; gap:10px; margin-top:10px; }
  details label { display:grid; gap:4px; font-size:12px; color:var(--muted); }
  input[type=number], input[type=text] { width:100%; background:var(--raised); color:var(--text);
         border:1px solid var(--line); border-radius:6px; padding:6px 8px; font: 13px "Segoe UI", system-ui, sans-serif; }
  input:focus { outline:none; border-color:var(--accent); }
  #hint { color:var(--muted); font-size:12px; min-height:1em; }
  hr { border:none; border-top:1px solid var(--line); margin:0; }
</style>
</head>
<body>
<header>
  <img src="icons/icon48.png" alt="">
  <b>YDM</b>
  <span id="status"><span id="led"></span><span id="statusText">Checking…</span></span>
</header>
<main>
  <button class="primary" id="grab">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="3.5" width="9.5" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 7 15 4.5v7L10.5 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    Download the video on this tab
  </button>
  <div>
    <div class="legend">Media on this page</div>
    <div id="media" style="margin-top:8px"><div class="empty">Play something and its streams show up here.</div></div>
  </div>
  <hr>
  <label class="switch-row">Catch browser downloads
    <span class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></span>
  </label>
  <label class="switch-row">Show “Download video” button on videos
    <span class="switch"><input type="checkbox" id="videoButton"><span class="slider"></span></span>
  </label>
  <label class="switch-row">Show “Save photo” button on big pictures
    <span class="switch"><input type="checkbox" id="imageButton"><span class="slider"></span></span>
  </label>
  <details>
    <summary>More options</summary>
    <div class="grid">
      <label>Leave files smaller than (KB) to the browser <input type="number" id="minSizeKB" min="0"></label>
      <label>Never catch these extensions <input type="text" id="skipExt" placeholder="e.g. pdf, jpg"></label>
      <label>App port <input type="number" id="port" min="1024" max="65535"></label>
    </div>
  </details>
  <div id="hint"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
