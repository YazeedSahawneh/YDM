# Builds YDM-Setup-<version>.exe on GitHub and attaches it to the release, so
# installed copies can update themselves. Push a tag (v1.4.0) to release; the
# tag must match APP_VERSION in ydm/config.py. "Run workflow" (manual) rebuilds
# an existing tag, e.g. to attach a missing installer.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach, e.g. v1.4.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the version matches the tag
        shell: pwsh
        run: |
          $ver = python -c "from ydm.config import APP_VERSION; print(APP_VERSION)"
          if ("v$ver" -ne $env:TAG) { throw "Tag $env:TAG does not match APP_VERSION $ver in ydm/config.py" }
          "VER=$ver" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build YDM.exe
        run: >
          pyinstaller --noconfirm --windowed --name YDM --icon assets\ydm.ico
          --collect-submodules yt_dlp --collect-submodules spnego --hidden-import socksio main.py

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VER" installer\YDM.iss
          if (-not (Test-Path "dist\YDM-Setup-$env:VER.exe")) { throw "Installer was not built" }

      - name: Attach to the release
        shell: pwsh
        run: |
          # checkout brings a tag without its message: fetch the real (annotated) tag for the notes
          git fetch --force origin "refs/tags/$($env:TAG):refs/tags/$($env:TAG)"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = (git tag -l --format='%(contents)' $env:TAG | Out-String).Trim()
            if (-not $notes) { $notes = "YDM $env:VER" }
            Set-Content -Path release-notes.md -Value $notes -Encoding utf8
            gh release create $env:TAG --title "YDM $env:VER" --notes-file release-notes.md --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "Could not create the release $env:TAG" }
          }
          gh release upload $env:TAG "dist\YDM-Setup-$env:VER.exe" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not attach the installer" }
